name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: macOS 15 · resolve remote package + build Demo for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version
      - name: Resolve app-intent-contract-kit from GitHub (up to next major from 1.0.0)
        run: xcodebuild -resolvePackageDependencies -project Demo.xcodeproj -scheme Demo
      - name: Build Demo for iOS Simulator
        run: xcodebuild build -project Demo.xcodeproj -scheme Demo -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
